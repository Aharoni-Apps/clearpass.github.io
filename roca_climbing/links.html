<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>קיר טיפוס רוקה</title>

    <!-- Favicons -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap" rel="stylesheet">

    <link href="/assets/favicon.ico" rel="icon" type="image/svg+xml"/>

    <meta content="קיר טיפוס רוקה" property="og:title">
    <meta content="קיר טיפוס רוקה - קישורים" property="og:description">
    <meta content="https://links.clearpass.me/roca_climbing/assets/logo.png" property="og:image">
    <meta content="https://links.clearpass.me/roca_climbing/links.html" property="og:url">
    <meta content="website" property="og:type">
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => twemoji.parse(document.body));
    </script>

    <!-- Optional but recommended -->
    <meta content="summary_large_image" name="twitter:card">

    <meta content="width=device-width, initial-scale=1" name="viewport">

    <style>
        :root {
            font-family: "Heebo", sans-serif;
        }

        body {
            font-family: "Heebo", sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .logo {
            max-width: 180px;
            width: 100%;
            margin: 0 auto 24px;
            display: block;
        }

        h1 {
            margin-bottom: 20px;
        }

        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
        }

        a.blue-button {
            display: block;
            text-decoration: none;
            background: #2EA7DD;
            color: white;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        a.blue-button:hover {
            background: #1E88C3;
        }

        a.light-blue-button {
            display: block;
            text-decoration: none;
            background: #BFDBF3;
            color: white;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        a.light-blue-button:hover {
            background: #BFDBF3;
        }

        a.dark-blue-button {
            display: block;
            text-decoration: none;
            background: #007EB9;
            color: white;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        a.dark-blue-button:hover {
            background: #007EB9;
        }
    </style>
</head>
<body>

<div class="page">
    <img alt='קיר טיפוס רוקה' class="logo" src="assets/logo.png">

    <h1>קיר טיפוס רוקה</h1>
    <h2>כדי להשלים את ההרשמה, יש להסדיר את הוראת הקבע לחוג</h2>

    <a class="blue-button" href="https://arbox.link/kARYOjHF">חד-שבועי</a>
    <a class="blue-button" href="https://arbox.link/oS">דו-שבועי</a>

    </br>
    </br>
    <h4>במידה וזאת הרשמה ראשונה שלכם, יש להירשם בנוסף להתאחדות הטיפוס באופן חד פעמי</h4>
    <a class="dark-blue-button" href="https://ilca.org.il/">התאחדות הטיפוס</a>
</div>

</body>
</html>
